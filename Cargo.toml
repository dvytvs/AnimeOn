[package]
name = "animeon"
version = "0.1.0"
description = "AnimeOn application"
authors = ["Your Name"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [ "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[features]
# this feature is used for the Tauri build process to inject the correct runtime into the application
default = [ "tauri/default" ]