[package]
name = "animeon"
version = "1.0.0"
edition = "2021"

[lib]
name = "animeon_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
reqwest = { version = "0.12", features = ["blocking"] }
url = "2.5"
