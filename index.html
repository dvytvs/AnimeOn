<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeOn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        button {
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AnimeOn</h1>
        <p>Watch your favorite anime with ease</p>
        
        <button onclick="openSite()">Open AnimeOn Site</button>
        <button onclick="loginWithGoogle()">Login with Google</button>
        
        <div id="status" class="status">
            <p>Status: Checking connectivity...</p>
        </div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.tauri;
        
        async function openSite() {
            await invoke('open_animeon_site');
        }
        
        async function loginWithGoogle() {
            await invoke('open_google_login');
        }
        
        // Check site connectivity
        async function checkConnectivity() {
            try {
                const response = await fetch('https://animeon.cc/', { method: 'HEAD' });
                if (response.ok) {
                    document.getElementById('status').innerHTML = '<p>Status: Connected to main site</p>';
                    document.getElementById('status').className = 'status connected';
                } else {
                    document.getElementById('status').innerHTML = '<p>Status: Connected to mirror site</p>';
                    document.getElementById('status').className = 'status connected';
                }
            } catch (error) {
                document.getElementById('status').innerHTML = '<p>Status: Could not connect to any site</p>';
                document.getElementById('status').className = 'status disconnected';
            }
        }
        
        // Check connectivity on load
        checkConnectivity();
    </script>
</body>
</html>
